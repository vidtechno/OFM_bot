project_id = "ofm-game"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[functions.telegram-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/telegram-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/telegram-webhook/index.ts"

[functions.match-scheduler]
enabled = true
verify_jwt = false
import_map = "./functions/match-scheduler/deno.json"
entrypoint = "./functions/match-scheduler/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/telegram-webhook/*.html" ]
